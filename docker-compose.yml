services:
  whatsapp-bot:
    build: .
    container_name: whatsapp-requests-bot
    restart: unless-stopped
    ports:
      - "3006:3006"  # Webhook port (adjust if different in config)
    volumes:
      - ./config:/config  # Mount config directory as read-writable
      - ./lib:/app/lib  # Mount lib directory for live code changes (writable)
      - ./whatsapp-bot.js:/app/whatsapp-bot.js  # Mount main bot file (writable)
      - ./cli.js:/app/cli.js  # Mount CLI file (writable)
      - ./scripts:/app/scripts  # Mount scripts directory (writable)
    environment:
      - NODE_ENV=development
    command: node --watch whatsapp-bot.js  # Use watch mode for live reload
    networks:
      - whatsapp-network

networks:
  whatsapp-network:
    driver: bridge

