version: '3.8'

services:
  whatsapp-bot:
    build: .
    container_name: whatsapp-requests-bot
    restart: unless-stopped
    ports:
      - "3006:3006"  # Webhook port (adjust if different in config)
    volumes:
      - ./config:/config:ro  # Mount config directory as read-only
    environment:
      - NODE_ENV=production
    networks:
      - whatsapp-network

networks:
  whatsapp-network:
    driver: bridge

