<div data-role="page" class="page type-interior pluginConfigurationPage myAnimeListConfigurationPage">
  <div data-role="content">
    <div class="content-primary">
      <form class="myAnimeListConfigurationForm">
        <div class="inputContainer">
          <input is="emby-input" type="text" id="txtClientId" label="MyAnimeList Client ID" />
        </div>
        <div class="inputContainer">
          <input is="emby-input" type="password" id="txtClientSecret" label="MyAnimeList Client Secret" />
        </div>
        <div class="inputContainer">
          <input is="emby-input" type="text" id="txtRedirectUri" label="Redirect URI" />
        </div>
        <div>
          <button is="emby-button" type="button" class="raised button-submit" id="btnAuthorize">
            <span>Authorization URL erzeugen</span>
          </button>
          <button is="emby-button" type="button" class="raised" id="btnTest">
            <span>Verbindung testen</span>
          </button>
        </div>
        <div class="inputContainer">
          <textarea is="emby-textarea" id="txtAuthorizationUrl" label="Authorization URL" readonly></textarea>
        </div>
        <div class="inputContainer">
          <input is="emby-input" type="text" id="txtAuthorizationCode" label="Authorization Code" />
        </div>
        <div>
          <button is="emby-button" type="button" class="raised button-submit" id="btnExchange">
            <span>Code speichern</span>
          </button>
          <button is="emby-button" type="submit" class="raised button-submit">
            <span>Speichern</span>
          </button>
        </div>
      </form>
    </div>
  </div>
  <script type="text/javascript">
    (function () {
      var pluginId = "8c42041b-7e66-4e29-9e5f-384df45b4c32";

      function page() {
        return document.querySelector(".myAnimeListConfigurationPage");
      }

      function form() {
        return page().querySelector(".myAnimeListConfigurationForm");
      }

      function loadConfiguration() {
        Dashboard.showLoadingMsg();
        ApiClient.getPluginConfiguration(pluginId).then(function (config) {
          page().querySelector("#txtClientId").value = config.ClientId || "";
          page().querySelector("#txtClientSecret").value = config.ClientSecret || "";
          page().querySelector("#txtRedirectUri").value = config.RedirectUri || "http://localhost";
          Dashboard.hideLoadingMsg();
        });
      }

      function saveConfiguration() {
        Dashboard.showLoadingMsg();
        return ApiClient.getPluginConfiguration(pluginId).then(function (config) {
          config.ClientId = page().querySelector("#txtClientId").value;
          config.ClientSecret = page().querySelector("#txtClientSecret").value;
          config.RedirectUri = page().querySelector("#txtRedirectUri").value;
          return ApiClient.updatePluginConfiguration(pluginId, config);
        }).then(function () {
          Dashboard.processPluginConfigurationUpdateResult();
        });
      }

      page().addEventListener("pageshow", loadConfiguration);

      form().addEventListener("submit", function (event) {
        event.preventDefault();
        saveConfiguration();
      });

      page().querySelector("#btnAuthorize").addEventListener("click", function () {
        saveConfiguration().then(function () {
          return ApiClient.ajax({ type: "GET", url: ApiClient.getUrl("MyAnimeList/Auth/Url") });
        }).then(function (result) {
          page().querySelector("#txtAuthorizationUrl").value = result.Url;
        });
      });

      page().querySelector("#btnExchange").addEventListener("click", function () {
        var code = page().querySelector("#txtAuthorizationCode").value;
        Dashboard.showLoadingMsg();
        ApiClient.ajax({
          type: "POST",
          url: ApiClient.getUrl("MyAnimeList/Auth/Token"),
          data: JSON.stringify({ Code: code }),
          contentType: "application/json"
        }).then(function () {
          Dashboard.alert("MyAnimeList wurde verbunden.");
          Dashboard.hideLoadingMsg();
        });
      });

      page().querySelector("#btnTest").addEventListener("click", function () {
        Dashboard.showLoadingMsg();
        ApiClient.ajax({ type: "GET", url: ApiClient.getUrl("MyAnimeList/Auth/Test") }).then(function (user) {
          Dashboard.alert("Verbunden als " + user.Name + ".");
          Dashboard.hideLoadingMsg();
        });
      });
    })();
  </script>
</div>
